<div class="container">
  <div class="header">
    <h2> Newsletter SED SC</h2>
    <p class="subtitle">Inscreva seu e-mail institucional para receber novidades</p>
  </div>
  
  <div class="form-group">
    <label for="email">E-mail do Aluno:</label>
    <div class="input-container">
      <input 
        type="email" 
        id="email" 
        [(ngModel)]="emailInput" 
        placeholder="seu.nome@aluno.sed.gov.sc.br" 
        (keyup.enter)="cadastrarEmail()"
      />
      <button (click)="cadastrarEmail()">Cadastrar</button>
    </div>
  </div>

  <div *ngIf="mensagemErro" class="alert error">
    ⚠️ {{ mensagemErro }}
  </div>
  <div *ngIf="mensagemSucesso" class="alert success">
    ✅ {{ mensagemSucesso }}
  </div>

  <hr />

  <div class="list-section">
    <h3>
      E-mails Cadastrados 
      <span class="badge">{{ emailsList.length }}</span>
    </h3>
    
    <p *ngIf="emailsList.length === 0" class="empty">Nenhum e-mail cadastrado no momento.</p>
    
    <ul>
      <li *ngFor="let item of emailsList; let i = index">
        <span>#{{ i + 1 }}</span> {{ item }}
      </li>
    </ul>
  </div>
</div>
